# ------------------------------------------------------------------------
# OWASP CRS Plugin
# Plugin name: n8n-plugin
# Plugin description: n8n false-positive exclusions for OWASP CRS.
# ------------------------------------------------------------------------

# Rule numbers range: 9,530,000 - 9,530,999

# [932260] False positive when entering a new workflow.
SecRule REQUEST_FILENAME "@rx ^/rest/ph/flags/?$" \
    "id:9530090,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:ruleRemoveTargetById=932260;ARGS:compression"

# [934110] False positive when accessing the telemetry proxy.
SecRule REQUEST_URI "@beginsWith /rest/telemetry/proxy/v1/" \
    "id:9530100,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=934110"

# [930130] False positive when loading credentials while creating a workflow.
SecRule REQUEST_URI "@streq /types/credentials.json" \
    "id:9530110,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=930130"

# [941260] False positive when defining UTF-8 encoding in an HTML template.
SecRule ARGS:json.nodes.array_1.parameters.html \
    "@rx (?i)<meta\s+charset\s*=\s*\x22utf-8\x22\s*/?>" \
    "id:9530130,\
    phase:2,\
    pass,\
    nolog,\
    t:none,\
    ctl:ruleRemoveTargetById=941260;ARGS:json.nodes.array_1.parameters.html"

# [941190] False positive when saving workflow CSS/HTML.
SecRule REQUEST_URI "@beginsWith /rest/workflows" \
    "id:9530150,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=941190"

# [934200] False positive when saving workflows with n8n expressions.
SecRule REQUEST_URI "@beginsWith /rest/workflows" \
    "id:9530120,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=934200"

# [911100] False positive when updating a workflow with PATCH.
SecRule REQUEST_METHOD "@streq PATCH" \
    "id:9500130,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_FILENAME \
        "@rx ^/rest/workflows/[a-zA-Z0-9_-]+$" \
        "t:none,\
        ctl:ruleRemoveById=911100"

# [920420] False positive for text/plain public hooks.
SecRule REQUEST_HEADERS:Content-Type "@beginsWith text/plain" \
    "id:9500120,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.28.0',\
    chain"
    SecRule REQUEST_URI "@beginsWith /rest/ph/" \
        "t:none,\
        ctl:ruleRemoveById=920420"

# [921130] False positive when saving workflow HTML.
SecRule REQUEST_FILENAME "@rx ^/rest/workflows/[^/]+/?$" \
    "id:9500140,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:ruleRemoveById=921130"
