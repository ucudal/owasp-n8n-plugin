# OWASP CRS Plugin
# Plugin name: n8n-plugin
# Plugin description: False-positive exclusions for the n8n workflow
#                     automation platform.
# Rule ID block base: 9,530,000 (range is 1000, thus ID block base +1000)
# Plugin version: 1.0.0

# Generic rule to disable the plugin
#
# Plugins are enabled by default. They become active by being placed in the
# plugins folder. Activation can also be controlled by setting a variable,
# which is what this file is for.
#
# The predefined variable name is "<plugin name>-plugin_enabled". For this
# plugin that means it can be disabled by setting tx.n8n-plugin_enabled=0.
#
# Note that a global setting of this variable overrides the setting here:
# the "enabled" variable is only set by this rule if it has not been set
# before.
#
#SecRule &TX:n8n-plugin_enabled "@eq 0" \
#    "id:9530010,\
#    phase:1,\
#    pass,\
#    nolog,\
#    setvar:'tx.n8n-plugin_enabled=0'"

# Scoping the plugin to the n8n virtual host
#
# This plugin relaxes CRS on the request patterns n8n produces. In a shared
# deployment it should therefore be enabled only on the virtual host that
# actually serves n8n, so the exclusions cannot reach unrelated applications
# running on the same CRS engine.
#
# WebAppID is the canonical mechanism for this, but Coraza does not support
# it yet, so a Host-header gate is the portable option. Uncomment and adjust
# the host pattern to your deployment:
#
#SecAction \
#    "id:9530020,\
#    phase:1,\
#    nolog,\
#    pass,\
#    setvar:tx.n8n-plugin_enabled=0"
#
#SecRule REQUEST_HEADERS:Host "@rx ^n8n\.example\.com$" \
#    "id:9530021,\
#    phase:1,\
#    pass,\
#    nolog,\
#    t:none,\
#    setvar:tx.n8n-plugin_enabled=1"
