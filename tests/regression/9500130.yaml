---
meta:
  author: "Facundo Píriz"
  description: "Regression tests for the workflow PATCH method exclusion rule"
rule_id: 9500130
tests:
  - test_id: 1
    desc: Ensure a PATCH request that updates an existing workflow does not trigger CRS rule 911100.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: application/json
            Content-Type: application/json
          port: 80
          method: PATCH
          uri: /rest/workflows/testWorkflow123
          data: |
            {"name":"Updated workflow","active":false,"nodes":[],"connections":{}}
        output:
          log:
            no_expect_ids: [911100]
  - test_id: 2
    desc: Ensure a PATCH request with a hyphenated workflow identifier does not trigger CRS rule 911100.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: application/json
            Content-Type: application/json
          port: 80
          method: PATCH
          uri: /rest/workflows/workflow-test_123
          data: |
            {"name":"Updated workflow","active":true,"nodes":[],"connections":{}}
        output:
          log:
            no_expect_ids: [911100]
