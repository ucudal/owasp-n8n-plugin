---
meta:
  author: "Clara Plateiro"
  description: "Tests exclusion rule 9530248 for false positive 942330 on the n8n workflow filter"
  enabled: true
  name: "9530248.yaml"

rule_id: 9530248
tests:
  - test_title: 9530248-1
    desc: "Rule 942330 must not trigger for the workflow filter"
    stages:
      - stage:
          input:
            dest_addr: "127.0.0.1"
            port: 80
            method: "GET"
            uri: "/rest/workflows?filter=%7B%22parentFolderId%22%3A%220%22%2C%22projectId%22%3A%22test%22%7D"
            headers:
              Host: "localhost"
            version: "HTTP/1.1"
          output:
            no_log_contains: 'id "942330"'

  - test_title: 9530248-2
    desc: "Rule 942330 must remain active on unrelated endpoints"
    stages:
      - stage:
          input:
            dest_addr: "127.0.0.1"
            port: 80
            method: "GET"
            uri: "/test?filter=%7B%22parentFolderId%22%3A%220%22%2C%22projectId%22%3A%22test%22%7D"
            headers:
              Host: "localhost"
            version: "HTTP/1.1"
          output:
            log_contains: 'id "942330"'
