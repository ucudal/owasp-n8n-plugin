---
meta:
  author: "Facundo Píriz"
  description: "Regression tests for the workflow flags compression exclusion rule"
rule_id: 9530090
tests:
  - test_id: 1
    desc: Ensure the workflow flags endpoint does not trigger CRS rule 932260 for the compression parameter.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/x-www-form-urlencoded
          port: 80
          method: POST
          uri: /rest/ph/flags/
          data: |
            compression=deflate
        output:
          log:
            no_expect_ids: [932260]
  - test_id: 2
    desc: Ensure the workflow flags endpoint without a trailing slash does not trigger CRS rule 932260.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/x-www-form-urlencoded
          port: 80
          method: POST
          uri: /rest/ph/flags
          data: |
            compression=deflate
        output:
          log:
            no_expect_ids: [932260]
