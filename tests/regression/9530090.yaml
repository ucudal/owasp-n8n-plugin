---
meta:
  author: "Facundo Píriz and José Varela"
  description: "Regression tests for the PostHog feature flags parameter exclusions"
rule_id: 9530090
tests:
  - test_id: 1
    desc: Ensure the workflow flags endpoint does not trigger CRS rule 932260 for the compression parameter.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/x-www-form-urlencoded
          port: 80
          method: POST
          uri: /rest/ph/flags/
          data: |
            compression=deflate
        output:
          log:
            no_expect_ids: [932260]
  - test_id: 2
    desc: Ensure the workflow flags endpoint without a trailing slash does not trigger CRS rule 932260.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/x-www-form-urlencoded
          port: 80
          method: POST
          uri: /rest/ph/flags
          data: |
            compression=deflate
        output:
          log:
            no_expect_ids: [932260]

  - test_id: 3
    desc: >-
      Ensure the workflow flags endpoint does not trigger CRS rules 932236,
      932260, 942120, and 942432 for the base64 compression and data
      parameters.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: application/json,text/plain,*/*
            Content-Type: application/x-www-form-urlencoded
          port: 80
          method: POST
          uri: "/rest/ph/flags/?v=2&ver=1.407.2&compression=base64"
          data: data=eyJmb28iOiJiYXIifQ%3D%3D
        output:
          log:
            no_expect_ids: [932236, 932260, 942120, 942432, 949110]

  - test_id: 4
    desc: >-
      Ensure the workflow flags endpoint without a trailing slash does not
      trigger CRS rules 932236, 932260, 942120, and 942432 for the base64
      compression and data parameters.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: application/json,text/plain,*/*
            Content-Type: application/x-www-form-urlencoded
          port: 80
          method: POST
          uri: "/rest/ph/flags?v=2&ver=1.407.2&compression=base64"
          data: data=eyJmb28iOiJiYXIifQ%3D%3D
        output:
          log:
            no_expect_ids: [932236, 932260, 942120, 942432, 949110]

  - test_id: 5
    desc: >-
      Ensure the executions endpoint does not trigger SQL injection CRS rules
      942200, 942340, 942370, and 949110 for GET requests with legitimate cookies.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)
            Accept: application/json,text/plain,*/*
            Cookie: 'g_state={"i_l":0,"i_ll":1784740722700,"i_b":"xTxtjzm58Zorv9VN78Ef5xctJzA+LT8VoezvWOqpyDU","i_e":{"enable_itp_optimization":24},"i_et":1784740722700}'
          port: 80
          method: GET
          uri: /rest/executions/46
        output:
          log:
            no_expect_ids: [942200, 942340, 942370, 949110]
