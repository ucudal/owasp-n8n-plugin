---
meta:
  author: "Clara Plateiro"
  description: "Exclude rule 921130 when executing workflows containing HTML"

rule_id: 9500177

tests:
  - test_id: 1
    desc: Rule 921130 must not trigger when executing a workflow containing HTML.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: application/json
            Content-Type: application/json
          port: 80
          method: POST
          uri: /rest/workflows/FsUS2aTLjsuZVmfC/run
          data: |
            {
              "runData": {
                "HTML": [
                  {
                    "data": {
                      "main": [
                        [
                          {
                            "json": {
                              "html": "<!DOCTYPE html><html><head><meta charset=\"UTF-8\"></head><body><h1>Workflow output</h1></body></html>"
                            }
                          }
                        ]
                      ]
                    }
                  }
                ]
              }
            }
        output:
          log:
            no_expect_ids: [921130]

  - test_id: 2
    desc: Rule 921130 must remain active outside the workflow execution endpoint.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: application/json
            Content-Type: application/json
          port: 80
          method: POST
          uri: /rest/workflows/FsUS2aTLjsuZVmfC/edit
          data: |
            {
              "html": "<!DOCTYPE html><html><head><meta charset=\"UTF-8\"></head><body><h1>Test</h1></body></html>"
            }
        output:
          log:
            expect_ids: [921130]