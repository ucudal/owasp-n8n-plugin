---
meta:
  author: "Clara Plateiro"
  description: "Tests for rule 9530237"
  enabled: true
  name: "9530237.yaml"

rule_id: 9530237
tests:
  - test_title: 9530320-1
    desc: "Rule 911100 must not trigger for legitimate PATCH requests used to create or update n8n tags"
    stages:
      - stage:
          input:
            dest_addr: "127.0.0.1"
            port: 80
            method: "PATCH"
            uri: "/rest/tags/XJAjupTFvde9LXxa"
            headers:
              Host: "localhost"
              Content-Type: "application/json"
            data: |
              {
                "name": "prueba"
              }
          output:
            log:
              no_expect_ids:
                - 911100

  - test_title: 9530320-2
    desc: "Rule 911100 must remain enabled for PATCH requests to unrelated endpoints"
    stages:
      - stage:
          input:
            dest_addr: "127.0.0.1"
            port: 80
            method: "PATCH"
            uri: "/rest/users/test"
            headers:
              Host: "localhost"
              Content-Type: "application/json"
            data: |
              {
                "name": "prueba"
              }
          output:
            log:
              expect_ids:
                - 911100

  - test_title: 9530320-3
    desc: "Rule 911100 must not trigger for legitimate DELETE requests used to remove n8n tags"
    stages:
      - stage:
          input:
            dest_addr: "127.0.0.1"
            port: 80
            method: "DELETE"
            uri: "/rest/tags/XJAjupTFvde9LXxa"
            headers:
              Host: "localhost"
          output:
            log:
              no_expect_ids:
                - 911100

  - test_title: 9530320-4
    desc: "Rule 911100 must remain enabled for DELETE requests to unrelated endpoints"
    stages:
      - stage:
          input:
            dest_addr: "127.0.0.1"
            port: 80
            method: "DELETE"
            uri: "/rest/users/test"
            headers:
              Host: "localhost"
          output:
            log:
              expect_ids:
                - 911100
