---
meta:
  author: "Clara Plateiro"
  description: "Regression tests for the Code node JavaScript exclusion"
rule_id: 932130
tests:
  - test_id: 1
    desc: Ensure saving JavaScript in a Code node does not trigger CRS rule 932130.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: application/json
            Content-Type: application/json
          port: 80
          method: PATCH
          uri: /rest/workflows/testWorkflow123
          data: |
            {
              "nodes": [
                {
                  "parameters": {
                    "jsCode": "return items.map((item) => ({ json: { nombre: item.json.nombre ?? \"Sin nombre\", total: Number(item.json.precio ?? 0) * Number(item.json.cantidad ?? 0), fecha: new Date().toISOString() } }));"
                  }
                }
              ]
            }
        output:
          log:
            no_expect_ids: [932130]

  - test_id: 2
    desc: Ensure rule 932130 remains active for JavaScript outside the jsCode parameter.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: application/json
            Content-Type: application/json
          port: 80
          method: PATCH
          uri: /rest/workflows/testWorkflow123
          data: |
            {
              "nodes": [
                {
                  "parameters": {
                    "otherCode": "return items.map((item) => ({ json: { nombre: item.json.nombre ?? \"Sin nombre\" } }));"
                  }
                }
              ]
            }
        output:
          log:
            expect_ids: [932130]
