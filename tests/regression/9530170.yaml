---
meta:
  author: "Benjamin Rielli and Martina Laventure"
  description: "Regression tests for the PostHog cookie exclusion and workflow JavaScript exclusion rule"
rule_id: 9530170
tests:
  - test_id: 1
    desc: Ensure /rest/projects/my-projects does not trigger CRS SQLi rules on the PostHog cookie.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: application/json, text/plain, */*
            Cookie: device_token=da67baee-d03f-4350-ae58-b577f82430e6; ph_phc_kMstNfAgBcBkWSh6KdsgN09heqqNe5VNmalHP1Ni9Q4_posthog={"$device_id":"12044ace496091205de0b1815523c484234402500ae1379334c0a81b192ddf71#700da09c-89bf-4fad-8740-d2587c66c623","distinct_id":"12044ace496091205de0b1815523c484234402500ae1379334c0a81b192ddf71#700da09c-89bf-4fad-8740-d2587c66c623","$user_state":"anonymous"}
          port: 80
          method: GET
          uri: /rest/projects/my-projects
        output:
          log:
            no_expect_ids: [942200, 942340, 942370]

  - test_id: 2
    desc: Ensure saving JavaScript in a workflow HTML template does not trigger CRS rule 941100.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: application/json
            Content-Type: application/json
          port: 80
          method: PATCH
          uri: /rest/workflows/testWorkflow123
          version: HTTP/1.1
          data: |
            {
              "nodes": [
                {
                  "parameters": {
                    "html": "<html><body><script>alert('test')</script></body></html>"
                  }
                }
              ]
            }
        output:
          log:
            no_expect_ids: [941100]

  - test_id: 3
    desc: Ensure CRS rule 941100 remains active outside the workflow update endpoint.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: application/json
            Content-Type: application/json
          port: 80
          method: PATCH
          uri: /rest/credentials/testCredential123
          version: HTTP/1.1
          data: |
            {
              "html": "<html><body><script>alert('test')</script></body></html>"
            }
        output:
          log:
            expect_ids: [941100]
