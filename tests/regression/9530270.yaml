---
meta:
  author: "Mateo Tonkovic"
  description: "Regression tests for the credentials apiKey SQLi exclusion"
rule_id: 9530270
tests:
  - test_id: 1
    desc: Ensure saving a credential with punctuation in data.apiKey does not trigger CRS rule 942200.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: application/json, text/plain, */*
            Content-Type: application/json
          port: 80
          method: POST
          uri: /rest/credentials
          version: HTTP/1.1
          data: |
            {
              "name": "test credential",
              "type": "httpHeaderAuth",
              "data": {
                "apiKey": "hasjbdknlmad,/;Aad"
              }
            }
        output:
          log:
            no_expect_ids: [942200, 949110]

  - test_id: 2
    desc: Ensure CRS rule 942200 remains active for the same payload outside data.apiKey.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: application/json, text/plain, */*
            Content-Type: application/json
          port: 80
          method: POST
          uri: /rest/credentials
          version: HTTP/1.1
          data: |
            {
              "name": "hasjbdknlmad,/;Aad",
              "type": "httpHeaderAuth",
              "data": {
                "apiKey": "plain-value"
              }
            }
        output:
          log:
            expect_ids: [942200]
