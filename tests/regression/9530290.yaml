---
meta:
  author: "Facundo Píriz"
  description: "Regression tests for the text/plain public hooks exclusion rule"
rule_id: 9530290
tests:
  - test_id: 1
    desc: Ensure a text/plain request to a public hooks endpoint does not trigger CRS rule 920420.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: application/json,text/plain,*/*
            Content-Type: text/plain
          port: 80
          method: POST
          uri: /rest/ph/events
          data: |
            n8n public hook payload
        output:
          log:
            no_expect_ids: [920420]
  - test_id: 2
    desc: Ensure a text/plain request with a charset to a public hooks endpoint does not trigger CRS rule 920420.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: application/json,text/plain,*/*
            Content-Type: text/plain; charset=utf-8
          port: 80
          method: POST
          uri: /rest/ph/flags
          data: |
            compression=deflate
        output:
          log:
            no_expect_ids: [920420]
