---
meta:
  author: "Benjamin Rielli"
  description: "Regression tests for the workflow JavaScript exclusion rule"
rule_id: 9530170
tests:
  - test_id: 1
    desc: Ensure saving JavaScript in a workflow HTML template does not trigger CRS rule 941100.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: application/json
            Content-Type: application/json
          port: 80
          method: PATCH
          uri: /rest/workflows/testWorkflow123
          version: HTTP/1.1
          data: |
            {
              "nodes": [
                {
                  "parameters": {
                    "html": "<html><body><script>alert('test')</script></body></html>"
                  }
                }
              ]
            }
        output:
          log:
            no_expect_ids: [941100]

  - test_id: 2
    desc: Ensure CRS rule 941100 remains active outside the workflow update endpoint.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: application/json
            Content-Type: application/json
          port: 80
          method: PATCH
          uri: /rest/credentials/testCredential123
          version: HTTP/1.1
          data: |
            {
              "html": "<html><body><script>alert('test')</script></body></html>"
            }
        output:
          log:
            expect_ids: [941100]
