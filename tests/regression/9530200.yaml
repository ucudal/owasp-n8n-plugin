---
meta:
  author: "José Varela"
  description: "Regression test for the dynamic node parameter options exclusion rule"
rule_id: 9530200
tests:
  - test_id: 1
    desc: "Ensure the dynamic node parameter options endpoint does not trigger CRS rule 930120."
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: "text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5"
            Content-Type: "application/json"
          port: 80
          method: GET
          uri: /rest/dynamic-node-parameters/options
          version: HTTP/1.1
        output:
          log:
            no_expect_ids: [930120]
