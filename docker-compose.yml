name: n8n-crs-lab

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.29.10
    container_name: n8n-app
    restart: unless-stopped

    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http

      N8N_EDITOR_BASE_URL: http://localhost:8080/
      WEBHOOK_URL: http://localhost:8080/
      N8N_PROXY_HOPS: 1

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

      GENERIC_TIMEZONE: America/Montevideo
      TZ: America/Montevideo

    expose:
      - "5678"

    volumes:
      - n8n_data:/home/node/.n8n

    networks:
      - protected_network

  n8n-direct:
    image: docker.n8n.io/n8nio/n8n:2.29.10
    container_name: n8n-direct-app
    restart: unless-stopped

    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http

      N8N_EDITOR_BASE_URL: http://localhost:5679/
      WEBHOOK_URL: http://localhost:5679/
      N8N_PROXY_HOPS: 1

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

      GENERIC_TIMEZONE: America/Montevideo
      TZ: America/Montevideo

    ports:
      - "5679:5678"

    volumes:
      - n8n_direct_data:/home/node/.n8n

    networks:
      - protected_network

  waf:
    image: owasp/modsecurity-crs:4.28.0-nginx-202607100407
    container_name: n8n-waf
    restart: unless-stopped

    depends_on:
      - n8n
      - fluent-bit

    ports:
      - "8080:8080"

    environment:
      BACKEND: http://n8n:5678

      SERVER_NAME: localhost
      PORT: "8080"

      # On bloquea, DetectionOnly solo registra
      MODSEC_RULE_ENGINE: ${MODSEC_RULE_ENGINE}

      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG: /dev/stdout
      MODSEC_AUDIT_LOG_FORMAT: JSON

      BLOCKING_PARANOIA: "2"
      DETECTION_PARANOIA: "3"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      REPORTING_LEVEL: "2"

      NGINX_X_FORWARDED_PROTO: http
      NGINX_X_FORWARDED_PORT: "8080"

      SERVER_TOKENS: "off"

    volumes:
      - ./nginx/proxy_backend.conf.template:/etc/nginx/templates/includes/proxy_backend.conf.template:ro
      - ./rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      - ./rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:ro

    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        tag: waf.modsecurity

    networks:
      - protected_network
      - logging_network

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: opensearch
    restart: unless-stopped
    environment:
      - cluster.name=waf-logs-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      # deshabilitado a propósito, es un lab local
      - "DISABLE_SECURITY_PLUGIN=true"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - logging_network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    container_name: opensearch-dashboards
    restart: unless-stopped
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - logging_network

  # Crea el index pattern y los dashboards (ver dashboards-init/init.sh)
  dashboards-init:
    image: alpine:3.20
    container_name: opensearch-dashboards-init
    depends_on:
      opensearch-dashboards:
        condition: service_started
      opensearch-init:
        condition: service_completed_successfully
    volumes:
      - ./dashboards-init/init.sh:/init.sh:ro
    networks:
      - logging_network
    restart: "no"
    entrypoint: >
      sh -c "apk add --no-cache bash >/dev/null 2>&1 && bash /init.sh"

  fluent-bit:
    image: fluent/fluent-bit:3.1
    container_name: fluent-bit
    restart: unless-stopped
    ports:
      - "24224:24224"
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./parsers.conf:/fluent-bit/etc/parsers.conf:ro
    depends_on:
      opensearch:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
    networks:
      - logging_network

  # Crea el index template con mapping nested para transaction.messages
  # antes de que lleguen los primeros documentos
  opensearch-init:
    image: curlimages/curl:8.10.1
    container_name: opensearch-init
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - logging_network
    restart: "no"
    entrypoint: >
      sh -c "
      curl -s -X PUT http://opensearch:9200/_index_template/modsec-logs-template
      -H 'Content-Type: application/json'
      -d '{\"index_patterns\":[\"modsec-logs*\"],\"template\":{\"mappings\":{\"properties\":{\"transaction\":{\"properties\":{\"messages\":{\"type\":\"nested\"}}}}}}}'
      && echo 'Index template aplicado.'
      "

volumes:
  n8n_data:
  n8n_direct_data:
  opensearch_data:

networks:
  protected_network:
    driver: bridge
  logging_network:
    driver: bridge
