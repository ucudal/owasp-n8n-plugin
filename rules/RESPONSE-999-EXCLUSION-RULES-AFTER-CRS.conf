# [930110] Falso positivo por ../ en el campo fileSelector de un nodo de archivos.
SecRuleUpdateTargetById 930110 "!ARGS:nodes.nodes.parameters.fileSelector"
SecRuleUpdateTargetById 930110 "!ARGS:json.nodes.array_0.parameters.fileSelector"

# [930120] Exclusions for credentials
SecRule REQUEST_URI "@beginsWith /" \
    "id:9530300,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule ARGS_NAMES "@rx ^json\.nodes\..*\.credentials\.[^.]+\.name$" \
        "t:none,\
        ctl:ruleRemoveById=930120"


