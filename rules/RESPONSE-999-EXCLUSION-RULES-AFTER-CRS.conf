# la que va a after 
# [930110] Falso positivo por ../ en el campo fileSelector de un nodo de archivos.
# Config-time: quita SOLO ese campo de la inspeccion de la 930110; la regla sigue
# activa para el URI y todos los demas campos del request.
SecRuleUpdateTargetById 930110 "!ARGS:/^json[.]nodes[.]array_[0-9]+[.]parameters[.]fileSelector$/"