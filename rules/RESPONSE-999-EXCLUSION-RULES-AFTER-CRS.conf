# [932130] False positive when saving JavaScript code in the Code node
SecRuleUpdateTargetById 932130 !ARGS:/^json\.nodes\.array_[0-9]+\.parameters\.jsCode$/
SecRuleUpdateTargetById 932130 !ARGS:/^nodes\.nodes\.parameters\.jsCode$/

# [942200/942340/942370] Falso positivo por la cookie de PostHog (cualquier endpoint)
SecRuleUpdateTargetByTag "attack-sqli" "!REQUEST_COOKIES:/^ph_phc_[A-Za-z0-9]+_posthog$/"
