#Rule Numers Range 9.530.000 - 9.530.999

# [932236, 932260, 942120] False positives when sending PostHog flags
SecRule REQUEST_FILENAME "@rx ^/rest/ph/flags/?$" \
    "id:9530090,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:ruleRemoveTargetById=932236;ARGS:compression,\
    ctl:ruleRemoveTargetById=932260;ARGS:compression,\
    ctl:ruleRemoveTargetById=942120;ARGS:data"

# [934110] False positive when accessing the telemetry proxy
SecRule REQUEST_URI "@beginsWith /rest/telemetry/proxy/v1/" \
    "id:9530100,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=934110"

# [942200/942340/942370] False positive when sending telemetry events
SecRule REQUEST_METHOD "@streq POST" \
    "id:9530145,\
    phase:1,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_URI "@streq /rest/telemetry/proxy/v1/track" \
        "t:none,\
        ctl:ruleRemoveTargetById=942200;REQUEST_COOKIES,\
        ctl:ruleRemoveTargetById=942340;REQUEST_COOKIES,\
        ctl:ruleRemoveTargetById=942370;REQUEST_COOKIES"

# [930130] False positive when loading credentials while creating a workflow
SecRule REQUEST_URI "@streq /types/credentials.json" \
    "id:9530110,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=930130"

# [941100] False positive when saving a workflow with an HTML template that contains JavaScript
SecRule REQUEST_FILENAME "@rx ^/rest/workflows/[^/]+$" \
    "id:9530170,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_METHOD "@streq PATCH" \
        "t:none,\
        ctl:ruleRemoveById=941100"

# [941260] False positive when defining UTF-8 encoding in an HTML template
SecRule REQUEST_FILENAME "@rx ^/rest/workflows/[A-Za-z0-9_-]+$" \
    "id:9530130,\
    phase:2,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_METHOD "@streq PATCH" \
        "t:none,\
        chain"
        SecRule ARGS "@rx (?i)<meta\s+charset\s*=\s*\x22utf-8\x22\s*/?>" \
            "t:none,\
            ctl:ruleRemoveById=941260"

# [941190] False positive when saving a workflow with CSS styles in HTML
SecRule REQUEST_URI "@beginsWith /rest/workflows" \
    "id:9530150,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=941190"

# [942200, 942340, 942370] False positive when refreshing the n8n dashboard.
SecRule REQUEST_METHOD "@streq GET" \
    "id:9530151,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_FILENAME \
        "@streq /rest/ph/static/surveys.js.map" \
        "t:none,\
        ctl:ruleRemoveById=942200,\
        ctl:ruleRemoveTargetById=942340;REQUEST_COOKIES:ph_phc_kMstNfAgBcBkWSh6KdsgN09heqqNe5VNmalHP1Ni9Q4_posthog,\
        ctl:ruleRemoveTargetById=942370;REQUEST_COOKIES:ph_phc_kMstNfAgBcBkWSh6KdsgN09heqqNe5VNmalHP1Ni9Q4_posthog"

# [934200] False positive when saving a workflow with n8n expressions (step 3.8)
SecRule REQUEST_URI "@beginsWith /rest/workflows" \
    "id:9530120,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=934200"

# [942200/942340/942370] False positive when accessing my-projects due to the PostHog cookie
SecRule REQUEST_URI "@streq /rest/projects/my-projects" \
    "id:9530190,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=942200;REQUEST_COOKIES,\
    ctl:ruleRemoveTargetById=942340;REQUEST_COOKIES,\
    ctl:ruleRemoveTargetById=942370;REQUEST_COOKIES"
    
# [911100] False positive when updating a workflow with a PATCH method.
SecRule REQUEST_METHOD "@streq PATCH" \
    "id:9500130,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_FILENAME \
        "@rx ^/rest/workflows/[a-zA-Z0-9_-]+$" \
        "t:none,\
        ctl:ruleRemoveById=911100"

# [921130] False positive when saving a workflow with HTML
SecRule REQUEST_FILENAME "@rx ^/rest/workflows/[a-zA-Z0-9_-]+/?$" \
    "id:9500140,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:ruleRemoveById=921130"

# [941160] False positive when saving a workflow with an HTML template (<meta> tag)
SecRule REQUEST_FILENAME "@rx ^/rest/workflows(?:/[^/]+)?/?$" \
    "id:9530200,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:ruleRemoveById=941160"

# [920420] False positive in the PostHog proxy (disallowed Content-Type)
SecRule REQUEST_HEADERS:Content-Type "@beginsWith text/plain" \
    "id:9530210,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.28.0',\
    chain"
    SecRule REQUEST_URI "@beginsWith /rest/ph/" \
        "t:none,\
        ctl:ruleRemoveById=920420"

# [942100] False positive when saving a workflow with a Merge node in SQL Query mode.
SecRule REQUEST_METHOD "@streq PATCH" \
    "id:9500150,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/rest/workflows/[^/]+/?$" \
        "t:none,\
        ctl:ruleRemoveTargetById=942100;ARGS:nodes.nodes.parameters.query,\
        ctl:ruleRemoveTargetById=942100;ARGS:json.nodes.array_0.parameters.query"

# [941110] False positive when saving an n8n workflow HTML template.
# For PATCH /rest/workflows/<id>, disable 941110 when a parsed request argument contains a <script> tag.
SecRule REQUEST_METHOD "@streq PATCH" \
    "id:9530160,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_FILENAME \
        "@rx ^/rest/workflows/[a-zA-Z0-9_-]+$" \
        "t:none,\
        chain"
        SecRule ARGS \
            "@rx (?i)<script(?:\s|>)" \
            "t:none,\
            ctl:ruleRemoveById=941110"

# [930100] False positive when creating a workflow with a path in a Read/Write Files from Disk node
SecRule REQUEST_METHOD "@streq POST" \
    "id:9530180,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/rest/workflows/?$" \
        "t:none,\
        ctl:ruleRemoveTargetById=930100;ARGS:nodes.nodes.parameters.fileSelector,\
        ctl:ruleRemoveTargetById=930100;ARGS:json.nodes.array_0.parameters.fileSelector"

# [921130] False positive when executing a workflow containing HTML
SecRule REQUEST_FILENAME "@rx ^/rest/workflows/[A-Za-z0-9]+/run/?$" \
    "id:9500177,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:ruleRemoveById=921130"

# [942200, 942340] False positives when filtering the workflow list.
SecRule REQUEST_METHOD "@streq GET" \
    "id:9530220,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/rest/workflows/?$" \
        "t:none,\
        ctl:ruleRemoveTargetById=942200;ARGS:filter,\
        ctl:ruleRemoveTargetById=942340;ARGS:filter"

# [942200, 942340, 942370] False positives caused by n8n's PostHog analytics
# cookies. The token embedded in the cookie name varies between installations.
SecRule REQUEST_METHOD "@streq GET" \
    "id:9530230,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/rest/workflows/?$" \
        "t:none,\
        chain"
        SecRule REQUEST_COOKIES_NAMES "@rx ^ph_phc_.*_posthog$" \
            "t:none,\
            ctl:ruleRemoveById=942200,\
            ctl:ruleRemoveById=942340,\
            ctl:ruleRemoveById=942370"

# [942200/942340/942370] False positive caused by the PostHog cookie on the credentials listing.
# Scoped to the credentials endpoint with a query string (the real frontend call); a bare
SecRule REQUEST_URI "@beginsWith /rest/credentials?" \
    "id:9530250,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_COOKIES_NAMES "@rx ^ph_phc_.*_posthog$" \
        "t:none,\
        ctl:ruleRemoveById=942200,\
        ctl:ruleRemoveById=942340,\
        ctl:ruleRemoveById=942370"
